<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node.js Bulk STK Push Bot</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; background: #f8fafc; color: #0f172a; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 1.5rem; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    label { display: block; font-weight: 600; margin-top: 1rem; margin-bottom: 0.35rem; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    textarea { min-height: 170px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    button { margin-top: 1.25rem; background: #0f172a; color: #fff; border: none; padding: 0.75rem 1.25rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .log-box { margin-top: 1.5rem; background: #0b1120; color: #e2e8f0; padding: 1rem; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 0.85rem; white-space: pre-wrap; max-height: 360px; overflow-y: auto; }
    .hint { color: #475569; font-size: 0.85rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bulk STK Push Sender (3s Spacing)</h1>
    <p class="hint">Enter phone numbers separated by new lines or commas. Requests are sent 3 seconds apart.</p>

    <form id="bulkForm">
      <label for="amount">Amount (KES)</label>
      <input type="number" id="amount" name="amount" min="1" value="10" required />

      <label for="phones">Bulk Phone Numbers</label>
      <textarea id="phones" name="phones" placeholder="0712345678&#10;0722000111&#10;254733444555" required></textarea>
      <div class="hint">Accepts <code>07...</code>, <code>01...</code>, or <code>254...</code>.</div>

      <button type="submit" id="submitBtn">Send Bulk STK Push</button>
    </form>

    <div id="logBox" class="log-box">Ready. Detailed logs are written to Render Logs.</div>
  </div>

  <script>
    const form = document.getElementById('bulkForm');
    const btn = document.getElementById('submitBtn');
    const logBox = document.getElementById('logBox');

    function writeLog(line) {
      logBox.textContent += '\n' + line;
      logBox.scrollTop = logBox.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const amount = Number(document.getElementById('amount').value);
      const phones = document.getElementById('phones').value
        .split(/[\n,]+/)
        .map((p) => p.trim())
        .filter(Boolean);

      if (!phones.length) {
        writeLog('[ERROR] Please enter at least one phone number.');
        return;
      }

      btn.disabled = true;
      const estSeconds = Math.max(0, (phones.length - 1) * 3);
      logBox.textContent = `[INFO] Queueing ${phones.length} number(s) at KES ${amount} (3s apart, ~${estSeconds}s delay)...`;

      try {
        const res = await fetch('/api/bulk-stk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amount, phones }),
        });
        const data = await res.json();

        if (!res.ok || !data.ok) {
          writeLog(`[ERROR] ${data.error || `HTTP ${res.status}`}`);
        } else {
          writeLog(`[DONE] Batch ${data.batchId}`);
          for (const item of data.results) {
            writeLog(`- ${item.phone || item.input}: ${item.status} ${JSON.stringify(item.response ?? item.detail ?? '')}`);
          }
        }
      } catch (err) {
        writeLog(`[EXCEPTION] ${err.message}`);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
